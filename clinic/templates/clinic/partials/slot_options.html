<label for="id_time_slot">Available time <span class="required">*</span></label><select name="time_slot" id="id_time_slot" class="field" required><option value="">Choose a time</option>{% for slot in slots %}<option value="{{ slot.value }}" {% if slot.booked %}disabled{% endif %}>{% if slot.booked %}{{ slot.label }} — Booked{% else %}{{ slot.label }}{% endif %}</option>{% endfor %}</select>{% if closed_sunday %}<small class="field-error" role="alert">The clinic is closed on Sundays.</small>{% endif %}
