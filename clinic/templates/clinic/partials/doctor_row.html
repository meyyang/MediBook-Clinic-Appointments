<tr id="doctor-{{ doctor.pk }}"><td>{{ doctor.pk }}</td><td><strong>{{ doctor.full_name }}</strong></td><td>{{ doctor.specialty.name }}</td><td>₱{{ doctor.consultation_fee|floatformat:2 }}</td><td>{% include 'clinic/partials/availability_badge.html' %}</td><td class="row-actions"><a href="{% url 'doctor_edit' doctor.pk %}">Edit</a><form method="post" action="{% url 'toggle_accepting' doctor.pk %}" hx-post="{% url 'toggle_accepting' doctor.pk %}" hx-target="closest tr" hx-swap="outerHTML">{% csrf_token %}<button type="submit" class="text-button">Toggle</button></form><form method="post" action="{% url 'doctor_delete' doctor.pk %}" hx-post="{% url 'doctor_delete' doctor.pk %}" hx-target="closest tr" hx-swap="outerHTML" hx-confirm="Delete {{ doctor.full_name }}? This cannot be undone.">{% csrf_token %}<button class="text-button danger" type="submit">Delete</button></form></td></tr>
