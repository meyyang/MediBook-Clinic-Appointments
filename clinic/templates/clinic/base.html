{% load static %}<!doctype html><html lang="en" x-data="appShell()" x-init="init()" :class="$store.theme.dark ? 'dark' : ''"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}MediBook{% endblock %} · MediBook</title><link rel="stylesheet" href="{% static 'clinic/css/site.css' %}"><script src="https://unpkg.com/htmx.org@2.0.4" defer></script><script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.14.8/dist/cdn.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script><script defer src="{% static 'clinic/js/app.js' %}"></script><style>[x-cloak]{display:none!important}</style></head><body hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'><header class="site-header"><a class="brand" href="{% url 'doctor_list' %}"><span class="brand-mark">✚</span> MediBook</a><button class="menu-toggle" @click="menuOpen=!menuOpen" :aria-expanded="menuOpen.toString()" aria-label="Toggle navigation">☰</button><nav class="nav-links" x-show="menuOpen" x-transition @keydown.escape.window="menuOpen=false" :class="menuOpen ? 'nav-open' : ''"><a href="{% url 'doctor_list' %}" @click="menuOpen=false">Find a doctor</a><a href="{% url 'manage_doctors' %}" @click="menuOpen=false">Manage doctors</a><a href="{% url 'manage_appointments' %}" @click="menuOpen=false">Appointments</a><button class="theme-toggle" @click="$store.theme.toggle()" x-text="$store.theme.dark ? '☀ Light' : '☾ Dark'"></button></nav></header><main class="container">{% if messages %}<div class="messages">{% for message in messages %}<div class="message {{ message.tags }}" role="status">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main><footer class="site-footer"><span>© {% now 'Y' %} MediBook Clinic</span><span>Care made easier.</span></footer><div class="toast-stack" aria-live="polite" aria-atomic="false"><template x-for="toast in $store.toasts.items" :key="toast.id"><div class="toast" :class="toast.kind" x-transition role="status"><span x-text="toast.message"></span><button @click="$store.toasts.remove(toast.id)" aria-label="Dismiss notification">×</button></div></template></div><script>document.addEventListener('htmx:afterRequest', e => { if (e.detail.successful && e.detail.xhr.getResponseHeader('HX-Trigger')?.includes('appointment-updated')) window.dispatchEvent(new CustomEvent('toast',{detail:{message:'Appointment updated',kind:'success'}})); });</script></body></html>
